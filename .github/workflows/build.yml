name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-lates
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (unsigniert)
        run: |
          xcodebuild \
            -project Aniworld.xcodeproj \
            -scheme YTApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/YTApp.app Payload/
          zip -r Aniworld.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Aniworld-IPA
          path: Aniworld.ipa